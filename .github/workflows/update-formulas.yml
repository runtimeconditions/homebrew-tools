name: Update formulas

on:
  repository_dispatch:
    types: [rc-cli-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable rc-cli release tag; blank selects the latest stable release
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    concurrency:
      group: update
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Select and validate the rc-cli release
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          tag="$RELEASE_TAG_INPUT"
          if [[ -z "$tag" ]]; then
            tag=$(gh api repos/runtimeconditions/rc-cli/releases/latest --jq '.tag_name')
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Unexpected rc-cli release tag: $tag" >&2
            exit 1
          }
          gh api "repos/runtimeconditions/rc-cli/releases/tags/$tag" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download release checksums
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/rc-cli-release"
          gh release download "$RELEASE_TAG" --repo runtimeconditions/rc-cli \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/rc-cli-release"
      - name: Update the tap-owned rc-cli formula
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 scripts/update_formula.py \
            --tag "$RELEASE_TAG" \
            --checksums "$RUNNER_TEMP/rc-cli-release/SHA256SUMS"
      - name: Commit the version and checksum update
        run: |
          git add Formula/rc-cli.rb
          git diff --cached --quiet && exit 0
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/rc-cli.rb)
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "rc-cli $version"
          git push origin HEAD:main
